name: CI

# A push runs the workflow file of the pushed commit, so this works on a branch that is not the default one.
# A manual run needs the file on the default branch.
on:
  push:
    branches:
      - main
      - develop-vnext
      - 'vnext/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# One run at a time for each work branch or pull request: a new push cancels the run in progress. On main and
# on develop-vnext each run is a group of its own, so every pushed commit is built and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref_name == 'main' || github.ref_name == 'develop-vnext') && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No usage data is sent by the .NET CLI or by Microsoft.Testing.Platform.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  # The version of the installer packages that are built and installed, and the one that they are upgraded to.
  BRAVO_VERSION: 1.1.0
  BRAVO_NEXT_VERSION: 1.1.1

jobs:

  # The required status check of main carries this name: the job keeps its id, gets no name and no matrix.
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # The whole history, here and in every job that builds: the version of a build counts the commits, and
      # the build fails on a shallow clone.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore Bravo.slnx --locked-mode
      # A warning in a project is an error already: -warnaserror adds the ones raised outside the projects.
      - name: Build
        run: dotnet build Bravo.slnx -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test --solution Bravo.slnx -c Release --no-build

  # The same steps on Linux, on the projects of the solution filter: the ones that do not target Windows.
  build-and-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore Bravo.Portable.slnf --locked-mode
      - name: Build
        run: dotnet build Bravo.Portable.slnf -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test --solution Bravo.Portable.slnf -c Release --no-build

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node.js line is the one of devEngines in package.json. The cache names the lockfile because the
      # action looks for it at the root of the repository.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies
        run: npm ci
      # The unit tests of the user interface. The script generates the client of the host API first.
      - name: Test
        run: npm test
      # The release build first checks the types of the sources and of the unit tests, then bundles.
      - name: Build the release bundle
        run: npm run build:Release

  # The tests of the user interface in the window of the application: they start the Bravo.exe that the build
  # wrote, with the development bundle beside it, and drive its webview through the DevTools protocol.
  test-window:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies of the user interface
        working-directory: web
        run: npm ci
      # The bundle first: the build of the application copies web/wwwroot beside the executable.
      - name: Build the development bundle
        working-directory: web
        run: npm run build:UI
      - name: Restore the application
        run: dotnet restore src/Bravo.Desktop --locked-mode
      - name: Build the application
        run: dotnet build src/Bravo.Desktop -c Release --no-restore -warnaserror
      - name: Test the user interface in the window
        working-directory: web
        run: npm run test:window
      # The report of a failed run, with the traces of the failed tests. A trace holds the headers of the
      # requests of its test, and so the token of a host whose process has ended.
      - name: Keep the report of the failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-tests-report
          path: artifacts/window-tests/
          retention-days: 3
          if-no-files-found: ignore
      # The tests run elevated on the runner, where the webview takes its two values from the policies of the
      # machine for Bravo.exe, which the tests write and take back: none is left, whatever the tests did.
      - name: Show that no policy of the webview is left
        if: ${{ always() }}
        shell: pwsh
        run: |
          $left = 0
          foreach ($name in 'AdditionalBrowserArguments', 'UserDataFolder') {
            $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\$name"
            $value = Get-ItemProperty -Path $key -Name 'Bravo.exe' -ErrorAction SilentlyContinue
            if ($value) {
              "$key has the value Bravo.exe: $($value.'Bravo.exe')"
              $left++
            } else {
              "$key has no value Bravo.exe"
            }
          }
          exit $left

  # The four installer packages, and two of the next version for the upgrades that the next job tries. The
  # program that the packages run is compiled ahead of time with the C++ build tools of the runner.
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the dependencies of the user interface
        working-directory: web
        run: npm ci
      # The packages carry the release bundle, which the build of the installer does not make.
      - name: Build the release bundle
        working-directory: web
        run: npm run build:Release
      - name: Restore the installer
        run: dotnet restore installer/Bravo.Installer.wixproj --locked-mode
      # The build validates each package against the rules of Windows Installer, and a warning fails it.
      - name: Build the four packages
        run: dotnet build installer/Bravo.Installer.wixproj -c Release --no-restore -t:BuildPackages -warnaserror -p:BravoVersion=${{ env.BRAVO_VERSION }}
      - name: Build the packages of the next version that the tests upgrade to
        shell: pwsh
        run: |
          foreach ($scope in 'perMachine', 'perUser') {
            dotnet build installer/Bravo.Installer.wixproj -c Release --no-restore -warnaserror -p:BravoVersion=${{ env.BRAVO_NEXT_VERSION }} -p:BravoScope=$scope -p:BravoSelfContained=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Show the size of the packages and of the program that they run
        shell: pwsh
        run: |
          Get-ChildItem artifacts/installer/en-US/*.msi, artifacts/installer-stage/${{ env.BRAVO_VERSION }}/setup-aot/Bravo.Setup.exe |
            ForEach-Object { '{0,12:N0} bytes  {1}' -f $_.Length, $_.Name }
      # Kept for the next job, and for a look at the dialogs on a machine that can be thrown away.
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-packages
          path: artifacts/installer/en-US/*.msi
          retention-days: 3
          if-no-files-found: error
          # The packages are compressed already.
          compression-level: 0

  # Real installations on the runner, each one silent: a first installation, the upgrade from 1.0.14 and
  # from this version, the public properties, the removal, per machine and per user.
  test-installer:
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages that use the installed runtime need the three runtimes of .NET 10, which the image of
      # the runner has: nothing is installed for them, and the step says so when one is missing.
      - name: Check the .NET runtimes of the runner
        shell: pwsh
        run: |
          $runtimes = dotnet --list-runtimes
          $runtimes
          foreach ($name in 'Microsoft.NETCore.App', 'Microsoft.AspNetCore.App', 'Microsoft.WindowsDesktop.App') {
            if (-not ($runtimes -match "^$name 10\.")) { throw "The runner has no $name 10." }
          }
      - name: Get the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-packages
          path: artifacts/installer-packages
      # The packages of the released version, from its public release: the ones that use the installed runtime.
      - name: Get the packages of 1.0.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.14 --repo sql-bi/Bravo --pattern "Bravo.1.0.14.x64-frameworkdependent*.msi" --dir artifacts/installer-previous
      - name: Install, upgrade and remove
        shell: pwsh
        run: >
          installer/tests/Test-Packages.ps1
          -PackagesFolder artifacts/installer-packages
          -PreviousFolder artifacts/installer-previous
          -Version ${{ env.BRAVO_VERSION }}
          -NextVersion ${{ env.BRAVO_NEXT_VERSION }}
          -LogFolder artifacts/installer-logs
      # The log of every run of Windows Installer, when a step failed.
      - name: Keep the logs of Windows Installer
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: artifacts/installer-logs/
          retention-days: 3
          if-no-files-found: ignore

  # Packages with a known vulnerability. On Windows, where a restore reaches every project of the solution.
  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # AuditPipeline turns the audit warnings of NuGet into errors: see Directory.Build.props.
      - name: Audit the NuGet packages
        run: dotnet restore Bravo.slnx --locked-mode -p:AuditPipeline=true
      # The installer is not a project of the solution: its packages are the WiX SDK and the dialogs of WiX.
      - name: Audit the NuGet packages of the installer
        run: dotnet restore installer/Bravo.Installer.wixproj --locked-mode -p:AuditPipeline=true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      # An advisory of any severity in a package that ships with the user interface fails the job.
      - name: Audit the npm packages that ship with the user interface
        working-directory: web
        run: npm audit --omit=dev
      # The packages of the build never leave the machine that builds: their advisories are reported, also
      # when the step above failed, and do not fail the job.
      - name: Report the advisories of every npm package
        if: ${{ !cancelled() }}
        working-directory: web
        continue-on-error: true
        run: npm audit
